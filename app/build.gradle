plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 34
    
    buildFeatures {
        buildConfig = true
    }
    
    defaultConfig {
        applicationId "ch.abertschi.adfree"
        minSdk 29  // Android 10 (API 29) - minimale unterstuetzte Version
        targetSdk 34  // Android 14 (API 34) - aktuelle Zielversion
        versionCode 50
        versionName "4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true

        // BuildConfig für alle BuildTypes generieren (auch release)
        buildConfigField "int", "VERSION_CODE", "50"
        buildConfigField "String", "VERSION_NAME", "\"4.0\""
        buildConfigField "boolean", "DEBUG", "false"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable = true
        }
    }
    
    sourceSets {
        main { res.srcDirs = ['src/main/res', 'src/main/values-large/'] }
        test {
            java.srcDirs = ['src/test/java', 'src/test/groovy']
        }
        debug { java.srcDirs = ['src/debug/java', 'src/test/groovy/'] }
    }
    
    namespace = 'ch.abertschi.adfree'
    
    lint {
        abortOnError = false
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    
    // AndroidX Core
    androidTestImplementation('androidx.test.espresso:espresso-core:3.5.1') {
        exclude group: 'androidx', module: 'support-annotations'
    }
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // Network & Data
    implementation 'com.github.kittinunf.fuel:fuel:2.3.1'
    implementation 'com.github.kittinunf.fuel:fuel-android:2.3.1'
    implementation 'com.github.bmoliveira:snake-yaml:v1.18-android'

    // Reactive
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'com.github.angads25:filepicker:1.1.1'

    // XML Processing
    implementation('com.thoughtworks.xstream:xstream:1.4.7') {
        exclude group: 'xmlpull', module: 'xmlpull'
    }

    // Test Dependencies
    testImplementation 'org.codehaus.groovy:groovy:3.0.9:grooid'
    testImplementation('org.spockframework:spock-core:2.3-groovy-3.0') {
        exclude group: 'org.codehaus.groovy'
        exclude group: 'junit'
    }
    testImplementation 'org.mockito:mockito-core:5.2.0'
    testImplementation 'org.mockito:mockito-android:5.2.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.1.0'
    implementation "com.jakewharton.timber:timber:5.0.1"
}

repositories {
    mavenCentral()
    google()
    maven { url = "https://jitpack.io" }
}
