name: CI - Gradle Build

on:
  push:
    branches: [ "unified", "master" ]
  pull_request:
    branches: [ "unified", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Accept all SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew --no-daemon --stacktrace test assembleDebug

      - name: Rename APK with build info
        run: |
          BUILD_DATE=${{ steps.date.outputs.date }}
          
          if [[ -f "app/build/outputs/apk/debug/app-debug.apk" ]]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" \
               "app/build/outputs/apk/debug/ad-free-unified-build-${BUILD_DATE}.apk"
            echo "Built APK: ad-free-unified-build-${BUILD_DATE}.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          path: app/build/outputs/apk/debug/ad-free-unified-build-${{ steps.date.outputs.date }}.apk
          name: ad-free-unified-build-${{ steps.date.outputs.date }}.apk
